[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "explainable-moe-debugger"
dynamic = ["version"]
description = "Visualization and explainability tools for Mixture-of-Experts routing decisions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Daniel Schmidt"},
]
keywords = [
    "machine-learning",
    "mixture-of-experts",
    "explainability",
    "debugging",
    "pytorch",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/danieleschmidt/Explainable-MoE-Debugger"
Repository = "https://github.com/danieleschmidt/Explainable-MoE-Debugger.git"

[tool.hatch.version]
path = "src/moe_debugger/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/moe_debugger"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "--cov=moe_debugger",
    "--cov-report=term-missing",
    "--cov-report=html",
]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/tests/*", "*/__about__.py"]

[tool.ruff]
target-version = "py310"
line-length = 88
